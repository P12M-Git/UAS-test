services:
  - type: web
    name: driver-performance
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    plan: starter
    disk:
      name: race-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: RACE_CACHE_DIR
        value: /var/data/races
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTH_USERS_JSON
        sync: false
      - key: APP_ORIGIN
        sync: false
